version: '3.3'

services:
    db:
        image: mysql:8.0
        volumes: 
            - ./mysql:/var/lib/mysql
        ports:
            - "4306:3306"
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: somepassword
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress

    wordpress:
        depends_on: 
            - db
        image: wordpress:latest
        volumes: 
            - ./src-wordpress/themes:/var/www/html/wp-content/themes
            - ./src-wordpress/plugins:/var/www/html/wp-content/plugins
            - ./src-wordpress/uploads:/var/www/html/wp-content/uploads
        ports:
            - "8000:80"
        restart: always
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DEBUG: 0
            WORDPRESS_TABLE_PREFIX: template_2026_
    
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: always
        container_name: phpmyadmintemplate2026
        depends_on: 
            - db
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: wordpress
